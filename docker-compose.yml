version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintech_fraud_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./fraud_detection.db}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-fintech.transactions}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-fraud-detection-group}
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL:-SSL}
      - KAFKA_SSL_CAFILE=${KAFKA_SSL_CAFILE:-}
      - KAFKA_SSL_CERTFILE=${KAFKA_SSL_CERTFILE:-}
      - KAFKA_SSL_KEYFILE=${KAFKA_SSL_KEYFILE:-}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME:-}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD:-}
      - ENVIRONMENT=development
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintech_fraud_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
